[package]
name = "bhwi-ffi"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license-file.workspace = true
repository = "https://github.com/wizardsardine/bhwi-ffi"
description = "UniFFI bindings for BHWI"

[lib]
crate-type = ["cdylib", "rlib"]
name = "bhwi_ffi"

[dependencies]
# bitcoin's own `base64` feature is off in this tree, so PSBT/signature base64 uses
# the same crate bhwi already pulls in.
base64ct = { version = "1.8.3", features = ["alloc"] }
bhwi = { workspace = true, features = ["bitbox", "coldcard", "jade", "ledger", "keepkey", "specter", "trezor"] }
rand_core = { workspace = true, features = ["getrandom"] }
thiserror.workspace = true
uniffi.workspace = true

# Tests only: report fixtures reuse the real bhwi-async HID transports.
# No async runtime or native I/O ships in the library.
[dev-dependencies]
async-trait.workspace = true
bhwi-async = { workspace = true, features = ["bitbox", "trezor"] }
futures.workspace = true
hex.workspace = true
# Same locked Noise implementation as the core; synthetic responder fixtures perform a real handshake.
noise-protocol = "=0.2.1"
serde_json = "1"

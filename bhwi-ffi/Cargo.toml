[package]
name = "bhwi-ffi"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license-file.workspace = true
repository = "https://github.com/wizardsardine/bhwi-ffi"
description = "UniFFI bindings for BHWI"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "bhwi_ffi"

[dependencies]
# bitcoin's own `base64` feature is off in this tree, so PSBT/signature base64 uses
# the same crate bhwi already pulls in.
base64ct = { version = "1.8.3", features = ["alloc"] }
bhwi = { workspace = true, features = ["bitbox"] }
rand_core = { workspace = true, features = ["getrandom"] }
thiserror.workspace = true
uniffi.workspace = true

# Tests only: the report-level Ledger HID fixtures are generated by driving the real
# `bhwi-async` device over an in-memory channel, so host bindings can verify their
# framing implementations against them. No I/O ships in the library.
[dev-dependencies]
async-trait.workspace = true
bhwi-async = { workspace = true, features = ["bitbox"] }
futures.workspace = true
hex.workspace = true
serde_json = "1"

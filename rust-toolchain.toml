[toolchain]
# Match bhwi's pinned toolchain so interpreter behavior is identical.
channel = "1.94.0"
components = ["cargo", "rustc", "rustfmt", "clippy"]
# Android AAR and iOS XCFramework targets; host target is implicit for tests/bindgen.
targets = [
  "aarch64-linux-android",
  "x86_64-linux-android",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
]
profile = "default"

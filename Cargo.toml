[workspace]
resolver = "3"
members = ["bhwi-ffi"]

[workspace.package]
authors = ["Edouard Paris <m@edouard.paris>", "Trevor Arjeski <tmarjeski@gmail.com>"]
license-file = "LICENSE"

[workspace.dependencies]
# Pinned bhwi rev; interpreters and the async driver come from here unchanged.
bhwi = { git = "https://github.com/wizardsardine/bhwi", rev = "b2fe6d73be13897f7bcaae641962b72f9e0f9b10" }
bhwi-async = { git = "https://github.com/wizardsardine/bhwi", rev = "b2fe6d73be13897f7bcaae641962b72f9e0f9b10" }
async-trait = "0.1"
futures = "0.3"
hex = "0.4.3"
log = "0.4"
rand_core = "0.6.4"
thiserror = "1"
uniffi = "0.32.0"

# For local development against a sibling bhwi checkout, uncomment:
# [patch."https://github.com/wizardsardine/bhwi"]
# bhwi = { path = "../bhwi/bhwi" }
# bhwi-async = { path = "../bhwi/bhwi-async" }

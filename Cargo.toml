[workspace]
resolver = "3"
members = ["bhwi-ffi", "bindgen"]

[workspace.package]
authors = ["Edouard Paris <m@edouard.paris>", "Trevor Arjeski <tmarjeski@gmail.com>"]
license-file = "LICENSE"

[workspace.dependencies]
# Local bhwi branch carrying the Send pairing-hook fix (pending upstream PR);
# repoint at wizardsardine once merged.
bhwi = { git = "file:///home/trev/Workspace/bhwi", branch = "pairing-hook-send" }
bhwi-async = { git = "file:///home/trev/Workspace/bhwi", branch = "pairing-hook-send" }
async-trait = "0.1"
futures = "0.3"
hex = "0.4.3"
rand_core = "0.6.4"
thiserror = "1"
uniffi = "0.32.0"

# For local development against a sibling bhwi checkout, uncomment:
# [patch."https://github.com/wizardsardine/bhwi"]
# bhwi = { path = "../bhwi/bhwi" }
# bhwi-async = { path = "../bhwi/bhwi-async" }
